<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Platter — Visual Artisan Discovery & Service Marketplace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--ink:#14302C;--mut:#4F6B66;--bg:#F4F9F8;--line:#D3E4E0;--tint:#DDEEEA;--brand:#65B0A6;--deep:#2A766D;--dark:#1F5E56}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;max-width:100vw;overflow-x:hidden;touch-action:manipulation}
header{background:var(--dark);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;position:sticky;top:0;z-index:5}
header img{height:22px;width:auto}
nav{display:flex;gap:4px;flex:0 1 auto;flex-wrap:nowrap}
.tab,.btn,.ghost{font:inherit;font-weight:600;border-radius:12px;cursor:pointer;min-height:40px;padding:0 16px;border:0}
.tab{background:transparent;color:#E3F1EE}.tab.on{background:var(--deep);color:#fff}
.btn{background:var(--deep);color:#fff}.ghost{background:#fff;color:var(--dark);border:2px solid var(--deep)}
.btn:disabled,.ghost:disabled{opacity:.6;cursor:wait}
.sm{min-height:34px;padding:0 12px;font-size:12px}
main{max-width:960px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:26px 0 10px}
.m{color:var(--mut);font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.list{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:150px}
label{display:block;font-weight:600;font-size:12px;margin-bottom:12px}
input,select,textarea{display:block;width:100%;margin-top:6px;font-size:16px;padding:11px 12px;border:1px solid #BFD5D0;border-radius:12px;background...}
input[type=checkbox]{display:inline;width:auto;margin:0 8px 0 0}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.tag{display:inline-block;border-radius:8px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--tint);color:var(--dark)}
.warn{background:#FBEFD5;color:#7A4B00}.good{background:#DDF0DC;color:#1E5A2B}.gray{background:#ECEFEE;color:var(--mut)}
table{width:100%;border-collapse:collapse;min-width:725px}
td,th{padding:10px 8px;border-bottom:1px solid #E3EEEB;text-align:left;vertical-align:top;font-size:13px}th{color:var(--mut);font-size:12px}
.tw{overflow-x:auto}.auth{max-width:420px;margin:30px auto}
.err{color:#8A1F1F;font-weight:600;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}.stats b{font-size:22px;display:block}
a{color:var(--dark);font-weight:600}
.logo-btn{background:transparent !important;border:0;border-radius:0;padding:0;min-height:auto;cursor:pointer;display:flex;align-items:center;box-shadow:none !important}
.logo-btn.on{background:transparent !important;box-shadow:none !important}
header .tab{padding:0 9px;white-space:nowrap;font-size:13px}#out{margin-left:auto;font-size:12px;padding:0 8px}header img{height:20px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--dark);color:#fff;border-radius:16px;padding:10px;margin:10px 0}
.toolbar input,.toolbar select{margin:0;width:auto;flex:1;min-width:140px;min-height:40px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:0 12px}
.toolbar input::placeholder{color:#BFE1DA}.toolbar select option{color:var(--ink);background:#fff}
.toolbtn{font:inherit;font-weight:600;font-size:12px;background:transparent;color:#E3F1EE;border:0;min-height:40px;padding:0 10px;cursor:pointer;border-radius:12px}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px}
.seg button{font:inherit;font-size:12px;font-weight:600;border:0;background:transparent;color:#E3F1EE;min-height:34px;padding:0 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:#fff;color:var(--dark)}
.gridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;background:#fff;color:#1F1F1F;border:1px solid #DADCE0;border-radius:14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.note{background:#FFF8E8;border:1px solid #F0DDB0;color:#6B4A00;border-radius:14px;padding:10px 12px;font-size:12px;margin:12px 0}
</style>
<link rel="stylesheet" href="platter-style.css">
</head>
<body>
<header>
  <button class="logo-btn" id="home" aria-label="Platter home"><img id="logo" src="platter-wordmark-white.png" alt="Platter" onerror="this.outerHTML='<b>Platter.</b>'"></button>
  <nav id="nav">
  <button class="tab-btn on" data-go="discover"><i class="fa-solid fa-house"></i> Home</button>
  <button class="tab-btn" data-go="artisans"><i class="fa-solid fa-hard-hat"></i> Artisans</button>
  <button class="tab-btn" data-go="mine"><i class="fa-solid fa-clipboard-list"></i> My Requests</button>
  <button class="tab-btn" data-go="profile"><i class="fa-solid fa-user"></i> Profile</button>
</nav>
  <button class="tab" id="out" hidden>Log out</button>
</header>
<main><div id="msg" role="status" aria-live="polite"></div><div id="view"></div></main>
<footer class="m" style="text-align:center;padding:0 16px 28px;position:relative;z-index:1"><a href="terms.html">Terms of Use</a> &middot; <a href="privacy.html">Privacy Notice</a></footer>

<script>
// --- GLOBAL STATE & CONFIGURATION ---
const MOVE = 'Pickup & goods transport';
const TRADES = ['Tiling', 'Kitchen cabinet installation', 'Door installation', 'Bathroom fitting & plumbing', MOVE];
const ST = { draft: ['Draft', ''], needs_clarification: ['Needs details', 'warn'], submitted: ['Waiting for a match', ''] };

// Helper utilities
const $ = s => document.querySelector(s);
const esc = s => (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const flash = msg => { const m = $('#msg'); if (m) m.textContent = msg; };

// User state & selections
var me = null; // Set to user object when logged in
var tab = 'discover';
var selectedCat = 'All';
var prefillArtisan = '';

// --- MOCK DATABASES ---
const SAMPLE_ARTISANS = [
  { name: 'Kofi Owusu', category: 'Kitchen cabinet installation', location: 'Accra' },
  { name: 'Kwame Mensah', category: 'Tiling', location: 'East Legon, Accra' },
  { name: 'Aboagye Doors', category: 'Door installation', location: 'Kumasi' },
  { name: 'Emmanuel Asante', category: 'Bathroom fitting & plumbing', location: 'Spintex, Accra' }
];

const SAMPLE_PROJECTS = [
  {
    id: 'p1',
    title: 'Modern Italian Porcelain Bathroom Tiling',
    trade: 'Tiling',
    category: 'Tiling',
    artisanName: 'Kwame Mensah',
    location: 'East Legon, Accra',
    image: 'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=600&q=80',
    description: 'Full wall-to-floor waterproofing and precision porcelain tile installation finished with epoxy grout.'
  },
  {
    id: 'p2',
    title: 'Custom Acrylic Kitchen Cabinetry',
    trade: 'Kitchen cabinet installation',
    category: 'Kitchen cabinet installation',
    artisanName: 'Kofi Owusu',
    location: 'Accra',
    image: 'https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&w=600&q=80',
    description: 'Bespoke soft-close kitchen units with integrated LED channel lighting.'
  }
];

// --- AUTH MODAL STUB ---
function showSignInModal(redirectTab) {
  alert('Please sign in or create an account to access this section.');
}

// --- UNIFIED ROUTER & AUTH GUARD ---
function go(targetTab) {
  // Auth guard: intercept unauthenticated guests accessing gated tabs
  if (!me && (targetTab === 'mine' || targetTab === 'profile')) {
    showSignInModal(targetTab);
    return;
  }

  tab = targetTab;
  flash('');

  // Update nav button active states
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-go') === targetTab);
  });

  // Render target view safely
  if (views[targetTab]) {
    views[targetTab]();
  }

  window.scrollTo(0, 0);
}

// --- VIEWS ---
function discoverView() {
  const viewEl = document.getElementById('view');
  if (!viewEl) return;

  viewEl.innerHTML = `
    <h2>Explore Recent Work</h2>
    <div class="list" style="display:flex;flex-direction:column;gap:16px;margin-top:12px">
      ${SAMPLE_PROJECTS.map(p => `
        <div class="card" style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;background:#fff">
          <img src="${p.image}" alt="${esc(p.title)}" style="width:100%;height:180px;object-fit:cover;display:block">
          <div style="padding:12px">
            <b style="font-size:15px;display:block;margin-bottom:4px">${esc(p.title)}</b>
            <div style="font-size:12px;color:#64748b;margin-bottom:8px">By <b>${esc(p.artisanName)}</b> · ${esc(p.location)}</div>
            <p style="font-size:13px;color:#334155;margin:0">${esc(p.description)}</p>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function artisansView() {
  const viewEl = document.getElementById('view');
  if (!viewEl) return;

  const categories = ['All', 'Tiling', 'Kitchen cabinet installation', 'Door installation', 'Bathroom fitting & plumbing'];
  const filtered = selectedCat === 'All' 
    ? SAMPLE_ARTISANS 
    : SAMPLE_ARTISANS.filter(a => a.category === selectedCat);

  viewEl.innerHTML = `
    <h2>Verified Artisans</h2>
    <div style="margin-bottom:14px;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px">
      ${categories.map(c => `<button class="btn sm ${selectedCat===c?'':'ghost'}" data-artcat="${c}">${c}</button>`).join('')}
    </div>
    <div class="list" style="display:flex;flex-direction:column;gap:12px">
      ${filtered.map(a => `
        <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #e2e8f0;border-radius:8px;background:#fff">
          <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">
            <div style="width:44px;height:44px;border-radius:50%;background:#e0f2fe;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0369a1;flex-shrink:0">
              ${a.name.charAt(0)}
            </div>
            <div style="flex:1;min-width:0">
              <b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px">${esc(a.name)}</b>
              <div style="font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.category)} · ${esc(a.location)}</div>
            </div>
          </div>
          <button class="btn sm ghost" data-art-profile="${esc(a.name)}">View Profile</button>
        </div>
      `).join('')}
    </div>
  `;
}

function customerView() {
  const viewEl = document.getElementById('view');
  if (!viewEl) return;
  viewEl.innerHTML = `<h2>Request Service</h2><p>Select a trade and post your project brief.</p>`;
}

function myRequestsView() {
  const viewEl = document.getElementById('view');
  if (!viewEl) return;
  viewEl.innerHTML = `<h2>My Requests</h2><p>Track your active jobs and quotes here.</p>`;
}

function profileView() {
  const viewEl = document.getElementById('view');
  if (!viewEl) return;
  viewEl.innerHTML = `<h2>Profile Settings</h2><p>Manage your account settings and preferences.</p>`;
}

// Router Map
const views = {
  discover: discoverView,
  artisans: artisansView,
  customer: customerView,
  mine: myRequestsView,
  profile: profileView
};

// --- GLOBAL EVENT LISTENERS ---
document.addEventListener('click', function(e) {
  // Navigation tabs
  const navBtn = e.target.closest('[data-go]');
  if (navBtn) {
    go(navBtn.getAttribute('data-go'));
    return;
  }

  // Category filter clicks in Artisans view
  const catBtn = e.target.closest('[data-artcat]');
  if (catBtn) {
    selectedCat = catBtn.getAttribute('data-artcat');
    artisansView();
    return;
  }
});

// Header Logo Home Link
const homeBtn = $('#home');
if (homeBtn) {
  homeBtn.onclick = () => go('discover');
}

// --- BOOTSTRAP INITIAL LOAD ---
go('discover');
</script>
</body>
</html>
